name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WatchMe.sln

      - name: Build
        run: dotnet build WatchMe.sln -c Release --no-restore

      - name: Test
        run: dotnet test WatchMe.sln -c Release --no-build --logger trx

      - name: Publish self-contained exe
        if: github.event_name == 'push'
        run: >
          dotnet publish src/WatchMe/WatchMe.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Zip artifact
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'latest' }
          Copy-Item publish/WatchMe.exe "WatchMe-windows-x64.zip" -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/WatchMe.exe -DestinationPath "WatchMe-windows-x64.zip" -Force
          "ZIP=WatchMe-windows-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Update latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: WatchMe (latest build)
          files: ${{ env.ZIP }}
          prerelease: false
          make_latest: true
          body: |
            自动构建于 main 分支最新提交 (${{ github.sha }})。
            下载 WatchMe-windows-x64.zip，解压后运行 WatchMe.exe 即可。
            未做代码签名，首次运行若遇 SmartScreen 提示，选择「仍要运行」。

      - name: Tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
