<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WatchMe: a capsule at the top of your screen drops down into a sticky-note board">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d14"/>
      <stop offset="0.55" stop-color="#14141d"/>
      <stop offset="1" stop-color="#0a1420"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#5E5CE6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e28"/>
      <stop offset="1" stop-color="#17171f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="560" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- top screen edge -->
  <line x1="40" y1="26" x2="1160" y2="26" stroke="#2a2a36" stroke-width="2"/>
  <text x="46" y="20" fill="#4a4a58" font-family="Segoe UI, sans-serif" font-size="11">desktop top edge</text>

  <!-- capsule -->
  <rect x="530" y="24" width="140" height="17" fill="#1C1C22" stroke="#3A3A46" stroke-width="1"/>
  <line x1="531" y1="40" x2="669" y2="40" stroke="#3A3A46" stroke-width="1"/>
  <text x="600" y="36" text-anchor="middle" fill="#9E9EA8" font-family="Segoe UI, sans-serif" font-size="9.5">WatchMe</text>

  <!-- drop arrow -->
  <path d="M600 46 L600 64 M594 58 L600 65 L606 58" stroke="#0A84FF" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- panel -->
  <rect x="440" y="72" width="320" height="420" rx="14" fill="url(#panel)" stroke="#3A3A46" stroke-width="1.5"/>

  <!-- panel header -->
  <text x="462" y="98" fill="#F2F2F7" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">便签</text>
  <text x="700" y="98" text-anchor="end" fill="#9E9EA8" font-family="Segoe UI, sans-serif" font-size="11">▴  ⚙</text>

  <!-- quick add -->
  <rect x="462" y="110" width="222" height="26" rx="5" fill="#232329" stroke="#3A3A46"/>
  <text x="472" y="127" fill="#5a5a66" font-family="Segoe UI, sans-serif" font-size="10">记点什么，回车保存</text>
  <rect x="692" y="110" width="46" height="26" rx="5" fill="#232329" stroke="#3A3A46"/>
  <text x="715" y="127" text-anchor="middle" fill="#9E9EA8" font-family="Segoe UI, sans-serif" font-size="10">工作 ▾</text>

  <!-- tag chips -->
  <g font-family="Segoe UI, sans-serif" font-size="10">
    <rect x="462" y="148" width="40" height="17" rx="9" fill="#2C2C3A" stroke="#0A84FF"/>
    <text x="482" y="160" text-anchor="middle" fill="#F2F2F7">全部</text>
    <rect x="508" y="148" width="40" height="17" rx="9" fill="none" stroke="#40404C"/>
    <text x="528" y="160" text-anchor="middle" fill="#9E9EA8">默认</text>
    <rect x="554" y="148" width="40" height="17" rx="9" fill="none" stroke="#40404C"/>
    <text x="574" y="160" text-anchor="middle" fill="#9E9EA8">工作</text>
    <rect x="600" y="148" width="40" height="17" rx="9" fill="none" stroke="#40404C"/>
    <text x="620" y="160" text-anchor="middle" fill="#9E9EA8">生活</text>
  </g>

  <!-- note cards -->
  <g font-family="Segoe UI, sans-serif">
    <!-- card 1: todo done -->
    <rect x="462" y="180" width="276" height="58" rx="8" fill="#FFF3A3"/>
    <circle cx="478" cy="196" r="6.5" fill="#5A9E6F"/>
    <path d="M475 196 L478 199 L482 193" stroke="#fff" stroke-width="1.6" fill="none"/>
    <text x="492" y="200" fill="#2B2B33" font-size="11" text-decoration="line-through">回复评审意见</text>
    <text x="726" y="199" text-anchor="end" fill="#8A6A5A" font-size="9">工作 ✕</text>
    <text x="478" y="228" fill="#8A8A7A" font-size="9">09-19 21:40</text>

    <!-- card 2 -->
    <rect x="462" y="248" width="276" height="58" rx="8" fill="#C9F0CE"/>
    <circle cx="478" cy="264" r="6.5" fill="none" stroke="#8A8A7A" stroke-width="1.5"/>
    <text x="492" y="268" fill="#2B2B33" font-size="11">买牛奶 + 咖啡豆</text>
    <text x="726" y="267" text-anchor="end" fill="#5A7A62" font-size="9">生活 ✕</text>
    <text x="478" y="296" fill="#8A8A7A" font-size="9">09-19 21:12</text>

    <!-- card 3 -->
    <rect x="462" y="316" width="276" height="58" rx="8" fill="#BFE0FF"/>
    <circle cx="478" cy="332" r="6.5" fill="none" stroke="#8A8A7A" stroke-width="1.5"/>
    <text x="492" y="336" fill="#2B2B33" font-size="11">ScreenLocator 物理像素方案 ✔</text>
    <text x="726" y="335" text-anchor="end" fill="#5A6E7A" font-size="9">默认 ✕</text>
    <text x="478" y="364" fill="#8A8A7A" font-size="9">09-19 18:30</text>
  </g>

  <!-- footer strip -->
  <rect x="440" y="452" width="320" height="26" rx="8" fill="#111119" stroke="#26262f"/>
  <text x="600" y="469" text-anchor="middle" fill="#7a7a86" font-family="Segoe UI, sans-serif" font-size="9.5">随手记 · 分类 · 勾掉 — WatchMe 便签</text>

  <!-- side annotations -->
  <g font-family="Segoe UI, sans-serif" fill="#8a8a96" font-size="12">
    <text x="150" y="130">全局热键</text>
    <text x="150" y="150" fill="#F2F2F7" font-size="16" font-weight="600">Ctrl + Alt + W</text>
    <text x="150" y="180" font-size="11">悬停或点击顶部胶囊，</text>
    <text x="150" y="198" font-size="11">便签板从屏幕顶端滑出。</text>

    <text x="150" y="330">本地存储</text>
    <text x="150" y="350" font-size="11">JSON 明文落在本机，</text>
    <text x="150" y="368" font-size="11">无账号、无广告、无联网。</text>
  </g>
  <g font-family="Segoe UI, sans-serif" fill="#8a8a96" font-size="12">
    <text x="930" y="130">标签分类</text>
    <text x="930" y="150" font-size="11">按标签筛选便签，</text>
    <text x="930" y="168" font-size="11">一种标签一种便签色。</text>

    <text x="930" y="330">待办勾选</text>
    <text x="930" y="350" font-size="11">点圆圈标记完成，</text>
    <text x="930" y="368" font-size="11">文字划线，一目了然。</text>
  </g>
  <g stroke="#2f2f3c" stroke-width="1" stroke-dasharray="3 4">
    <line x1="290" y1="140" x2="435" y2="140"/>
    <line x1="290" y1="340" x2="435" y2="340"/>
    <line x1="915" y1="140" x2="765" y2="140"/>
    <line x1="915" y1="340" x2="765" y2="340"/>
  </g>

  <!-- bottom accent -->
  <rect x="440" y="478" width="320" height="4" rx="2" fill="url(#accent)"/>
  <text x="600" y="516" text-anchor="middle" fill="#F2F2F7" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">WatchMe</text>
  <text x="600" y="534" text-anchor="middle" fill="#7a7a86" font-family="Segoe UI, sans-serif" font-size="10">顶部胶囊便签 · 为 Windows 而生</text>
</svg>
